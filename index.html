<head>

<title>Clube do Choro SAJ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0eb;font-family:Georgia,serif;display:flex;justify-content:center;padding:20px}
.card{max-width:480px;width:100%;background:#faf6f2;border-radius:20px;padding:28px 20px;box-shadow:0 8px 30px rgba(0,0,0,.08);border:1px solid #e8ddd2;margin:0 auto}
h1{font-size:24px;color:#3d3228;text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.sub{text-align:center;color:#8a7a6a;font-size:13px;font-style:italic;margin-bottom:20px}
.linha{height:1px;background:linear-gradient(to right,transparent,#d4c5b2,transparent);margin:16px 0}
.tit{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#8a7a6a;margin-bottom:10px;font-weight:600}
p{color:#4a3f35;font-size:14px;line-height:1.7;text-align:justify}
.musico{background:#f0e9e1;padding:8px 12px;border-radius:8px;margin-bottom:6px}
.musico b{display:block;font-size:13px}
.musico i{font-size:11px;color:#8a7a6a;font-style:italic}
.btn{display:block;padding:14px;border-radius:12px;text-align:center;font-size:15px;font-weight:600;text-decoration:none;margin-bottom:10px}
.whats{background:#25D366;color:#fff}
.insta{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff}
.prod{background:#d4c5b2;color:#3d3228}
.footer{text-align:center;margin-top:16px;font-size:11px;color:#a89888}
</style>
